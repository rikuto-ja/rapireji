<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QRカード決済 | らぴレジ</title>
    <!-- QRコードスキャン用ライブラリ -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray-bg: #f8f9fa;
            --gray-light: #e9ecef;
            --accent: #00ff00;
            --header-h: 60px;
            --danger: #ff0000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: var(--gray-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: calc(var(--header-h) + env(safe-area-inset-top));
            border-bottom: 3px solid var(--black);
            display: flex;
            align-items: center;
            padding: env(safe-area-inset-top) 20px 0 20px;
            background: var(--white);
            position: sticky;
            top: 0;
            z-index: 1100;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 900;
            white-space: nowrap;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .header-ad-space {
            display: flex !important;
            flex: 1;
            margin-left: 10px;
            height: 35px;
            min-width: 80px;
            border: 1px solid #ddd;
            background: #fff;
            font-size: 8px;
        }

        .btn-back {
            background: var(--white);
            border: 2px solid var(--black);
            padding: 8px 15px;
            font-weight: 900;
            cursor: pointer;
            margin-right: 15px;
        }

        .hidden {
            display: none !important;
        }

        .container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: var(--white);
            border: 4px solid var(--black);
            padding: 20px;
            box-shadow: 6px 6px 0 var(--black);
            margin-bottom: 25px;
        }

        .tab-group {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 5px;
            font-weight: 900;
            background: var(--white);
            border: 3px solid var(--black);
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: var(--black);
            color: var(--white);
        }

        label {
            display: block;
            font-weight: 900;
            margin: 10px 0 5px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 3px solid var(--black);
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 12px;
            outline: none;
            border-radius: 0;
        }

        .btn {
            width: 100%;
            background: var(--black);
            color: var(--white);
            border: 2px solid var(--black);
            padding: 14px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            margin-top: 8px;
        }

        .btn-secondary {
            background: var(--white);
            color: var(--black);
            border: 3px solid var(--black);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
            border: 3px solid var(--black);
        }

        input:disabled {
            background-color: var(--gray-light) !important;
            color: var(--black);
            -webkit-text-fill-color: var(--black);
            opacity: 1;
            cursor: not-allowed;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 15px;
        }

        .modal-content {
            background: #fff;
            padding: 15px;
            border: 4px solid #000;
            width: 100%;
            max-width: 320px;
            text-align: left;
            box-sizing: border-box;
        }

        .modal.hidden {
            display: none !important;
        }

        .numpad-display {
            width: 100%;
            padding: 8px;
            font-size: 1.5rem;
            border: 3px solid #000;
            text-align: right;
            font-weight: 900;
            margin-bottom: 10px;
            background: #eee;
            height: 3rem;
            line-height: 2.2rem;
            box-sizing: border-box;
            overflow: hidden;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .num-btn {
            padding: 10px;
            border: 2px solid #000;
            background: #fff;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
        }

        .btn-black {
            width: 100%;
            background: #000;
            color: #fff;
            padding: 12px;
            border: none;
            font-weight: 900;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
        }

        .btn-outline {
            width: 100%;
            background: #fff;
            color: #000;
            padding: 12px;
            border: 2px solid #000;
            font-weight: 900;
            margin-top: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        @media screen and (max-width: 768px) {
            header {
                padding: 0 10px;
            }

            header h1 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <header calss="header-left">
        <div class="header-left">
            <button id="backBtn" class="btn-back" onclick="location.href='payment.html'">← 戻る</button>
            <h1>QRカード決済</h1>
        </div>
        <div class="header-ad-space" id="ad-top">
            <span style="color:#ccc; font-size: 8px; font-weight: 900;">AD</span>
        </div>
    </header>

    <main class="container">
        <!-- タブ切り替え -->
        <div class="tab-group">
            <button class="tab-btn active" onclick="switchTab('scanTab')">QR読み取り</button>
            <button class="tab-btn" onclick="switchTab('searchTab')">会員検索</button>
        </div>

        <!-- 1. 読み取り画面 -->
        <div id="scanTab" class="tab-content" style="width: 100%; max-width: 500px;">
            <div class="card" id="readerCard">
                <h3 style="border-left: 6px solid #000; padding-left: 8px; margin-bottom: 15px;">会員QRコードをスキャン</h3>
                <div id="reader" style="width: 100%; margin-bottom: 15px;"></div>
            </div>
        </div>

        <!-- 2. 検索画面 -->
        <div id="searchTab" class="tab-content" style="display: none; width: 100%; max-width: 500px;">
            <div class="card">
                <h3 style="border-left: 6px solid #000; padding-left: 8px; margin-bottom: 15px;">会員データ検索</h3>
                <input type="text" id="searchQuery" placeholder="名前、電話番号、会員番号で検索" oninput="searchCards()">
                <div id="searchResults" style="margin-top: 10px;"></div>
            </div>
        </div>

        <!-- 3. カード認証後・決済操作パネル -->
        <div id="cardDetailPanel" class="card" style="display: none; width: 100%; max-width: 500px;">
            <div
                style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 10px;">
                <span id="detailNameDisplay" style="font-size: 1.2rem; font-weight: 900;"></span>
                <span id="detailStatus"
                    style="font-size:0.8rem; font-weight:900; padding:2px 6px; border:2px solid #000;">有効</span>
            </div>
            <p style="font-weight:800; font-size: 0.85rem; margin-bottom: 15px;">会員No: <span id="detailNo"></span></p>

            <!-- 残高 / ポイント表示 -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex:1; background: #eee; border: 2px solid #000; padding: 10px; text-align: center;">
                    <div style="font-size:0.75rem; font-weight:900;">デポジット残高</div>
                    <div style="font-size:1.2rem; font-weight:900;"><span id="detailBalance">0</span> 円</div>
                </div>
                <div style="flex:1; background: #eee; border: 2px solid #000; padding: 10px; text-align: center;">
                    <div style="font-size:0.75rem; font-weight:900;">ポイント残高</div>
                    <div style="font-size:1.2rem; font-weight:900;"><span id="detailPoint">0</span> pt</div>
                </div>
            </div>

            <!-- ★読み取り後に表示する「引き継いだ会計情報」および充当エリア -->
            <div style="background: #fff; border: 3px solid #000; padding: 12px; margin-bottom: 15px;">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 2px dashed #000; padding-bottom: 6px;">
                    <span style="font-size: 0.85rem; font-weight: 900;">会計合計</span>
                    <span style="font-size: 1.3rem; font-weight: 900;"><span id="targetAmountDisplay">0</span> 円</span>
                </div>

                <!-- 変更後 -->
                <label style="margin-top: 0; font-size: 0.85rem;">デポジット利用額 (円)</label>
                <input type="number" id="useDepositInput" value="0" min="0"
                    style="margin-bottom: 8px; background: #fff;" readonly
                    onclick="openNumpad('useDepositInput', 'デポジット利用額を入力')">

                <label style="font-size: 0.85rem;">ポイント利用額 (pt)</label>
                <input type="number" id="usePointInput" value="0" min="0" style="margin-bottom: 0; background: #fff;"
                    readonly onclick="openNumpad('usePointInput', 'ポイント利用額を入力')">
            </div>

            <button class=" btn" onclick="executePayment()">決済を実行する</button>
            <button class="btn btn-secondary" onclick="returnToPaymentWithoutPayment()">ポイントを付与して会計画面に戻る</button>
        </div>
    </main>

    <!-- テンキー入力用モーダル -->
    <div id="numpadModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="numpadTitle" style="margin-top: 0; margin-bottom: 8px; font-weight: 900; font-size: 1.1rem;">数値入力
            </h3>
            <div id="numpadDisplay" class="numpad-display">0</div>
            <div class="numpad-grid">
                <button class="num-btn" onclick="pressNum('7')">7</button>
                <button class="num-btn" onclick="pressNum('8')">8</button>
                <button class="num-btn" onclick="pressNum('9')">9</button>
                <button class="num-btn" onclick="pressNum('4')">4</button>
                <button class="num-btn" onclick="pressNum('5')">5</button>
                <button class="num-btn" onclick="pressNum('6')">6</button>
                <button class="num-btn" onclick="pressNum('1')">1</button>
                <button class="num-btn" onclick="pressNum('2')">2</button>
                <button class="num-btn" onclick="pressNum('3')">3</button>
                <button class="num-btn" style="visibility:hidden;"></button>
                <button class="num-btn" onclick="pressNum('0')">0</button>
                <button class="num-btn" onclick="pressNum('CLR')"
                    style="font-size: 0.9rem; background: #eee; padding: 10px 0;">CLR</button>
            </div>
            <button onclick="confirmNumpad()" class="btn-black">決定</button>
            <button onclick="closeNumpad()" class="btn-outline">キャンセル</button>
        </div>
    </div>

    <script>
        let activeCardData = null;
        let html5QrcodeScanner = null;
        let targetAmount = 0; // 別画面から引き継いだ会計金額
        let hasGrantedPoints = sessionStorage.getItem('rapireji_has_granted_points') === 'true';
        let currentTargetInputId = null;
        let numpadBuffer = "0";

        function openNumpad(inputId, titleText) {
            currentTargetInputId = inputId;
            const currentVal = document.getElementById(inputId).value;
            numpadBuffer = currentVal !== "" ? currentVal : "0";

            document.getElementById('numpadTitle').innerText = titleText;
            updateNumpadDisplay();
            document.getElementById('numpadModal').classList.remove('hidden');
        }

        // テンキーモーダルを閉じる
        function closeNumpad() {
            document.getElementById('numpadModal').classList.add('hidden');
            currentTargetInputId = null;
        }

        // テンキーのボタンが押されたとき
        function pressNum(val) {
            if (val === 'CLR') {
                numpadBuffer = "0";
            } else {
                if (numpadBuffer === "0") {
                    numpadBuffer = val;
                } else {
                    numpadBuffer += val;
                }
            }
            updateNumpadDisplay();
        }

        // 画面の表示を更新
        function updateNumpadDisplay() {
            document.getElementById('numpadDisplay').innerText = parseInt(numpadBuffer, 10).toLocaleString();
        }

        // 決定ボタンが押されたとき
        function confirmNumpad() {
            if (currentTargetInputId) {
                document.getElementById(currentTargetInputId).value = parseInt(numpadBuffer, 10);
            }
            closeNumpad();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const amountParam = urlParams.get('amount');
            if (amountParam && !isNaN(amountParam)) {
                targetAmount = parseInt(amountParam, 10);
            }
            startScanner();
        });

        // タブ切り替え
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';

            event.target.classList.add('active');
            document.getElementById('cardDetailPanel').style.display = 'none';

            if (tabId !== 'scanTab' && html5QrcodeScanner) {
                try {
                    html5QrcodeScanner.clear();
                    html5QrcodeScanner = null;
                } catch (e) { }
            }

            if (tabId === 'scanTab') {
                startScanner();
            }
        }

        // QRスキャナー起動
        function startScanner() {
            if (html5QrcodeScanner) {
                try { html5QrcodeScanner.clear(); } catch (e) { }
            }
            html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
            html5QrcodeScanner.render((decodedText) => {
                html5QrcodeScanner.clear().then(() => {
                    html5QrcodeScanner = null;
                    loadCardById(decodedText);
                }).catch(err => { console.error("カメラ停止エラー", err); });
            }, (error) => { });
        }

        function loadCardById(cardId) {
            const cards = JSON.parse(localStorage.getItem('rapireji_qrcards') || '[]');
            const card = cards.find(c => c.id === cardId.trim());

            if (!card) return alert('該当するカードデータが見つかりません');
            if (card.status !== 'active') return alert('このカードは停止中です');

            activeCardData = card;

            renderCardDetail();
        }

        function renderCardDetail() {
            const c = activeCardData;
            document.getElementById('scanTab').style.display = 'none';
            document.getElementById('searchTab').style.display = 'none';
            document.querySelectorAll('.tab-group').forEach(el => el.style.display = 'none');
            document.getElementById('cardDetailPanel').style.display = 'block';

            document.getElementById('detailNameDisplay').innerText = c.name + ' 様';
            document.getElementById('detailNo').innerText = c.id;
            document.getElementById('detailBalance').innerText = c.balance.toLocaleString();
            document.getElementById('detailPoint').innerText = (c.point || 0).toLocaleString();

            document.getElementById('targetAmountDisplay').innerText = targetAmount.toLocaleString();

            const depositInput = document.getElementById('useDepositInput');
            const pointInput = document.getElementById('usePointInput');
            const cardType = c.type || 'both';

            if (cardType === 'point') {
                depositInput.value = '';
                depositInput.placeholder = '--';
                depositInput.disabled = true;
                pointInput.disabled = false;
                pointInput.placeholder = '';
            } else if (cardType === 'deposit') {
                pointInput.value = '';
                pointInput.placeholder = '--';
                pointInput.disabled = true;
                depositInput.disabled = false;
                depositInput.placeholder = '';
            } else {
                depositInput.disabled = false;
                depositInput.placeholder = '';
                pointInput.disabled = false;
                pointInput.placeholder = '';
            }

            if (targetAmount > 0) {
                if (cardType !== 'point') {
                    depositInput.value = Math.min(targetAmount, c.balance);
                } else {
                    depositInput.value = 0;
                }
                pointInput.value = 0;
            } else {
                depositInput.value = 0;
                pointInput.value = 0;
            }
        }

        function resetSelection() {
            activeCardData = null;
            hasGrantedPoints = false;
            document.getElementById('cardDetailPanel').style.display = 'none';
            document.querySelectorAll('.tab-group').forEach(el => el.style.display = 'flex');
            switchTab('scanTab');
        }

        function selectSearchResult(cardId) {
            document.getElementById('searchQuery').value = '';
            document.getElementById('searchResults').innerHTML = '';
            loadCardById(cardId);
        }

        function searchCards() {
            const query = document.getElementById('searchQuery').value.trim().toLowerCase();
            const resultsEl = document.getElementById('searchResults');
            if (!query) { resultsEl.innerHTML = ''; return; }

            const cards = JSON.parse(localStorage.getItem('rapireji_qrcards') || '[]');
            const matched = cards.filter(c => c.name.toLowerCase().includes(query) || c.tel.includes(query) || c.id.toLowerCase().includes(query));

            if (matched.length === 0) {
                resultsEl.innerHTML = '<p style="font-size:0.85rem; font-weight:800; color:#666;">該当する会員が見つかりません</p>';
                return;
            }

            resultsEl.innerHTML = matched.map(c => `
                <div style="border: 2px solid #000; padding: 10px; margin-bottom: 8px; cursor: pointer; background: #fff;" onclick="selectSearchResult('${c.id}')">
                    <div style="font-weight:900;">${c.name} 様 (${c.status === 'active' ? '有効' : '停止中'})</div>
                    <div style="font-size:0.8rem; font-weight:800;">No: ${c.id} | TEL: ${c.tel}</div>
                    <div style="font-size:0.8rem; font-weight:800;">残高: ¥${c.balance.toLocaleString()} / pt: ${(c.point || 0).toLocaleString()}</div>
                </div>
            `).join('');
        }

        function calculateAndGrantPoints() {
            if (hasGrantedPoints) {
                return 0;
            }

            let pointRate = 0;
            const rawRate = localStorage.getItem('rapireji_point_rate');
            if (rawRate) {
                try {
                    const parsedData = JSON.parse(rawRate);
                    pointRate = parseFloat(parsedData.value) || parseFloat(parsedData) || 0;
                } catch (e) {
                    pointRate = parseFloat(rawRate) || 0;
                }
            }

            const cardType = activeCardData.type || 'both';
            let earnedPoints = 0;

            if (targetAmount > 0 && (cardType === 'point' || cardType === 'both') && pointRate > 0) {
                earnedPoints = Math.floor(targetAmount * (pointRate / 100));
            }

            if (earnedPoints > 0) {
                activeCardData.point = (activeCardData.point || 0) + earnedPoints;
                const nowStr = new Date().toLocaleString();
                activeCardData.history.unshift({ date: nowStr, type: 'ポイント付与', detail: `+${earnedPoints.toLocaleString()}pt` });
            }

            // 【変更】メモリとセッションストレージの両方に付与済みフラグを保存
            hasGrantedPoints = true;
            sessionStorage.setItem('rapireji_has_granted_points', 'true');

            return earnedPoints;
        }

        function executePayment() {
            if (!activeCardData) return;

            const useDeposit = parseInt(document.getElementById('useDepositInput').value, 10) || 0;
            const usePoint = parseInt(document.getElementById('usePointInput').value, 10) || 0;

            if (useDeposit < 0 || usePoint < 0) return alert('有効な数値を入力してください');
            if (activeCardData.balance < useDeposit) return alert('デポジット残高を超えて使用することはできません');
            if ((activeCardData.point || 0) < usePoint) return alert('ポイント残高を超えて使用することはできません');

            if (useDeposit === 0 && usePoint === 0) return alert('利用する金額またはポイントを入力してください');

            const earnedPoints = calculateAndGrantPoints();

            activeCardData.balance -= useDeposit;
            activeCardData.point = (activeCardData.point || 0) - usePoint;

            const nowStr = new Date().toLocaleString();
            if (useDeposit > 0) {
                activeCardData.history.unshift({ date: nowStr, type: 'デポジット利用', detail: `-¥${useDeposit.toLocaleString()}` });
            }
            if (usePoint > 0) {
                activeCardData.history.unshift({ date: nowStr, type: 'ポイント利用', detail: `-${usePoint.toLocaleString()}pt` });
            }

            const cards = JSON.parse(localStorage.getItem('rapireji_qrcards') || '[]');
            const idx = cards.findIndex(c => c.id === activeCardData.id);
            if (idx !== -1) {
                cards[idx] = activeCardData;
                localStorage.setItem('rapireji_qrcards', JSON.stringify(cards));
            }

            alert(`決済が完了しました。\nデポジット利用: -¥${useDeposit.toLocaleString()}\nポイント利用: -${usePoint.toLocaleString()}pt` + (earnedPoints > 0 ? `\nポイント獲得: +${earnedPoints.toLocaleString()}pt` : ''));

            const paymentResult = {
                cardId: activeCardData.id,
                cardName: activeCardData.name,
                usedDeposit: useDeposit,
                usedPoint: usePoint,
                earnedPoint: earnedPoints,
                isDepositUsed: useDeposit > 0,
                isPointUsed: usePoint > 0,
                currentBalance: activeCardData.balance,
                currentPoint: activeCardData.point,
                timestamp: nowStr
            };
            sessionStorage.setItem('rapireji_last_payment', JSON.stringify(paymentResult));
            window.location.href = 'payment.html';
        }

        function returnToPaymentWithoutPayment() {
            if (!activeCardData) {
                window.location.href = 'payment.html';
                return;
            }

            if (hasGrantedPoints) {
                const paymentResult = {
                    cardId: activeCardData.id,
                    cardName: activeCardData.name,
                    usedDeposit: 0,
                    usedPoint: 0,
                    earnedPoint: 0,
                    isDepositUsed: false,
                    isPointUsed: false,
                    currentBalance: activeCardData.balance,
                    currentPoint: activeCardData.point,
                    timestamp: new Date().toLocaleString()
                };
                sessionStorage.setItem('rapireji_last_payment', JSON.stringify(paymentResult));
                window.location.href = 'payment.html';
                return;
            }

            const earnedPoints = calculateAndGrantPoints();

            if (earnedPoints > 0) {
                const cards = JSON.parse(localStorage.getItem('rapireji_qrcards') || '[]');
                const idx = cards.findIndex(c => c.id === activeCardData.id);
                if (idx !== -1) {
                    cards[idx] = activeCardData;
                    localStorage.setItem('rapireji_qrcards', JSON.stringify(cards));
                }
                // 【追加】ポイントが付与された旨をアラートで通知
                alert(`ポイントを付与しました。\n獲得ポイント: +${earnedPoints.toLocaleString()}pt`);
            } else {
                // ポイント付与対象外（レートが0または会計金額が0以下など）の場合の通知
                alert('ポイント付与対象外の金額、または設定です。');
            }

            const paymentResult = {
                cardId: activeCardData.id,
                cardName: activeCardData.name,
                usedDeposit: 0,
                usedPoint: 0,
                earnedPoint: earnedPoints,
                isDepositUsed: false,
                isPointUsed: false,
                currentBalance: activeCardData.balance,
                currentPoint: activeCardData.point,
                timestamp: new Date().toLocaleString()
            };
            sessionStorage.setItem('rapireji_last_payment', JSON.stringify(paymentResult));
            window.location.href = 'payment.html';
        }    
    </script>
</body>
