<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>お支払い | らぴレジ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bignumber.js/9.1.2/bignumber.min.js"></script>
    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --gray-bg: #f8f9fa;
            --gray-light: #e9ecef;
            --danger: #ff0000;
            --header-h: 60px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: var(--gray-bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            height: calc(var(--header-h) + env(safe-area-inset-top));
            border-bottom: 3px solid var(--black);
            display: flex;
            align-items: center;
            padding: env(safe-area-inset-top) 20px 0 20px;
            background: var(--white);
            position: sticky;
            top: 0;
            z-index: 1100;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .btn-back {
            background: var(--white);
            border: 2px solid var(--black);
            padding: 8px 15px;
            font-weight: 900;
            cursor: pointer;
            margin-right: 15px;
        }

        .header-ad-space {
            flex: 1;
            margin-left: 20px;
            height: 50px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed #ccc;
        }

        .container {
            flex: 1;
            display: flex;
            padding: 30px;
            gap: 30px;
            justify-content: center;
            overflow-y: auto;
        }

        @media screen and (max-width: 768px) {
            header {
                padding: 0 10px;
            }

            header h1 {
                font-size: 0.9rem;
                margin-left: 10px;
                flex-shrink: 0;
            }

            .header-ad-space {
                display: flex !important;
                flex: 1;
                margin-left: 10px;
                height: 35px;
                min-width: 80px;
                border: 1px solid #ddd;
                background: #fff;
                font-size: 8px;
            }

            .container {
                flex-direction: column;
                align-items: center;
                padding: 15px;
                gap: 20px;
            }

            .price-details {
                order: 1;
                width: 100%;
            }

            .payment-grid {
                order: 2;
                width: 100%;
            }
        }

        .price-details {
            width: 100%;
            max-width: 400px;
            background: var(--white);
            border: 4px solid var(--black);
            padding: 25px;
            box-shadow: 10px 10px 0 var(--black);
            height: fit-content;
        }

        .price-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .price-line.total {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 4px solid var(--black);
            font-size: 1.8rem;
            font-weight: 900;
        }

        .tax-detail {
            font-size: 0.8rem;
            color: #666;
            margin-top: -10px;
            margin-bottom: 10px;
            padding-left: 10px;
        }

        .tax-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .payment-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }

        .pay-btn {
            background: var(--white);
            border: 4px solid var(--black);
            padding: 30px 15px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 6px 6px 0 var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100px;
        }

        .pay-btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        /* 決済選択画面のボタンが無効な時のスタイル */
        .pay-btn:disabled {
            background-color: #ccc !important;
            border-color: #999 !important;
            color: #666 !important;
            cursor: not-allowed;
            opacity: 0.6;
            /* ネオ・ブルータリズムの影を消す、または薄くする */
            box-shadow: none !important;
            transform: none !important;
        }

        .pay-btn.discount-trigger {
            color: var(--danger);
            border-color: var(--danger);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 10px;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border: 4px solid #000;
            width: 100%;
            max-width: 380px;
            box-shadow: 10px 10px 0 #000;
            max-height: 95vh;
            overflow-y: auto;
        }

        .modal.hidden {
            display: none !important;
        }

        .numpad-display {
            width: 100%;
            padding: 10px;
            font-size: 1.8rem;
            border: 3px solid #000;
            text-align: right;
            font-weight: 900;
            margin-bottom: 10px;
            background: #eee;
        }

        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .num-btn {
            padding: 12px;
            border: 2px solid #000;
            background: #fff;
            font-size: 1.3rem;
            font-weight: 900;
            cursor: pointer;
        }

        .discount-presets {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 10px;
        }

        .preset-btn {
            background: #fff;
            border: 2px solid var(--danger);
            color: var(--danger);
            padding: 8px 5px;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-black {
            width: 100%;
            background: #000;
            color: #fff;
            padding: 15px;
            border: none;
            font-weight: 900;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .btn-outline {
            width: 100%;
            background: #fff;
            color: #000;
            padding: 15px;
            border: 2px solid #000;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
        }

        .receipt-area {
            background: #fff;
            border: 1px dashed #000;
            padding: 15px;
            /* iOSでの等幅フォントをより確実に固定 */
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            white-space: pre;
            /* pre-wrapからpreに変更して改行制御を確実に */
            font-size: 0.85rem;
            line-height: 1.2;
            margin-bottom: 15px;
            color: #000;
            word-break: break-all;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum" 1, "palt" 0;
            letter-spacing: 0;
        }

        @media print {
            @page {
                size: 58mm auto;
                margin: 0;
            }

            body * {
                visibility: hidden;
            }

            #receiptPreview,
            #receiptPreview * {
                visibility: visible !important;
                display: block !important;
            }

            #receiptPreview {
                position: absolute;
                left: 0;
                top: 0;
                width: 54mm;
                padding: 2mm;
                font-size: 9pt;
                border: none !important;
                background: white !important;
            }
        }

        /* CSSに追加推奨：長押し時のシステムメニューを抑制 */
        #btnPrintBill {
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* ダイアログ表示中の誤操作防止 */
        .modal-content {
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- styleタグの中に追加 --- */
        .pay-btn {
            -webkit-user-select: none;
            /* iOS Safari */
            -webkit-touch-callout: none;
            /* iOS Safari (長押しメニュー禁止) */
            user-select: none;
            /* 標準 */
            touch-action: none;
            /* ブラウザのジェスチャーを無効化 */
        }

        /* サイト全体でダブルタップズームを禁止する */
        html,
        body {
            touch-action: manipulation;
        }

        /* 決済ボタンやテンキーなど、連続して叩く可能性がある要素に適用 */
        .pay-btn,
        .num-btn,
        .btn-black,
        .btn-outline,
        .preset-btn,
        .btn-back {
            /* none: すべてのブラウザジェスチャ（ズーム、スクロール）を禁止 
       manipulation: スクロールは許可し、ダブルタップズームのみを禁止（推奨）
    */
            touch-action: manipulation;

            /* ボタン連打時にテキストが選択されて青くなるのを防ぐ */
            -webkit-user-select: none;
            user-select: none;

            /* iOSでのタップ時のハイライト（グレーの影）を消す */
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>

    <audio id="snd-beep1" src="beep1.mp3" preload="auto"></audio>
    <audio id="snd-beep2" src="beep2.mp3" preload="auto"></audio>

    <header>
        <div class="header-left">
            <button id="backBtn" class="btn-back">← 戻る</button>
            <h1 style="font-weight: 900;">お支払い</h1>
        </div>
        <div class="header-ad-space" id="ad-top">
            <span style="color:#ccc; font-size: 8px; font-weight: 900;">AD</span>
        </div>
        <button id="clerk-call-btn" class="cat-tab"
            style="display: none; margin-left: 10px; padding: 6px 12px; font-size: 1.0rem; background-color: red; color: #ffffff; border: 6px solid #ffffff; border-radius: 15px; box-shadow: none; font-weight: 900; outline: none;">店員呼出</button>
    </header>

    <!-- 例: 会計画面にある「QR決済へ進む」ボタン -->
    <button id="qrPaymentBtn" class="btn-back">QRカード操作</button>

    <main class="container">
        <div class="price-details">
            <div class="price-line"><span>小計(税抜)</span><span id="subtotal">¥0</span></div>

            <div id="taxBreakdown" class="tax-detail hidden">
            </div>

            <div class="price-line" style="color: var(--danger);"><span>割引額</span><span id="discountAmount">-¥0</span>
            </div>
            <div class="price-line" id="afterDiscountExclLine"
                style="font-size: 0.9rem; color: #333; margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 5px; display: none;">
                <span>割引後小計(税抜)</span><span id="afterDiscountExcl">¥0</span>
            </div>
            <div class="price-line total"><span>最終合計</span><span id="finalTotal">¥0</span></div>
            <div id="paymentProgress"
                style="color: #666; font-size: 0.85rem; margin-top: 10px; padding-left: 10px; line-height: 1.4;"></div>
        </div>

        <div class="payment-grid" id="paymentGrid">
            <button class="pay-btn discount-trigger" onclick="openKeypad('discount')">割引</button>
        </div>
    </main>

    <div id="keypadModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="keypadTitle" style="margin-bottom: 10px; font-weight: 900;">金額入力</h3>
            <div id="keypadDisplay" class="numpad-display">0</div>
            <div class="numpad-grid">
                <button class="num-btn" onclick="pressNum('7')">7</button>
                <button class="num-btn" onclick="pressNum('8')">8</button>
                <button class="num-btn" onclick="pressNum('9')">9</button>
                <button class="num-btn" onclick="pressNum('4')">4</button>
                <button class="num-btn" onclick="pressNum('5')">5</button>
                <button class="num-btn" onclick="pressNum('6')">6</button>
                <button class="num-btn" onclick="pressNum('1')">1</button>
                <button class="num-btn" onclick="pressNum('2')">2</button>
                <button class="num-btn" onclick="pressNum('3')">3</button>
                <button class="num-btn" onclick="pressNum('0')">0</button>
                <button class="num-btn" onclick="pressNum('00')">00</button>
                <button id="discountUnitBtn" class="num-btn" onclick="toggleDiscountUnit()"
                    style="background: #eee; border-color: #000;">¥</button>
            </div>
            <div id="discountPresetArea" class="discount-presets"></div>
            <button id="keypadConfirmBtn" class="btn-black">確定</button>
            <button onclick="closeModal('keypadModal')" class="btn-outline">キャンセル</button>
        </div>
    </div>

    <div id="receiptModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="text-align: center; margin-bottom: 5px; font-weight: 900;">決済完了</h3>
            <div id="paymentResultMsg" style="text-align: center; margin-bottom: 15px; min-height: 20px;"></div>
            <div id="receiptPreview" class="receipt-area"></div>
            <div style="display: flex; flex-direction: column; gap: 5px;">
                <button id="btnPrintReceipt" class="btn-black" style="background: #808080;">レシート印刷</button>
                <button id="btnPrintBill" class="btn-black" style="background: #808080;">領収書印刷</button>
                <button id="next-checkout-btn" class="btn-outline"
                    style="border-width:3px; background:#eee;">次の会計へ</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEYS = {
            HISTORY: 'rapireji_history',
            PROFILE: 'rapireji_profile',
            PAYMENTS: 'rapireji_payments',
            DISCOUNTS: 'rapireji_discounts',
            PRODUCTS: 'rapireji_products',
            STOCK_CONFIG: 'rapireji_stock_config',
            AUTO_DISCOUNTS: 'rapireji_auto_discounts',
            CONFIG: 'rapireji_config'
        };

        const savedProfile = JSON.parse(localStorage.getItem(STORAGE_KEYS.PROFILE)) || {};
        let shopInfo = {
            companyName: savedProfile.companyName || "らぴレジ店舗",
            address: savedProfile.address || "",
            tel: savedProfile.tel || "",
            memo: savedProfile.memo || "",
            receiptType: savedProfile.receiptType || "商品代"
        };

        let order = JSON.parse(sessionStorage.getItem('currentOrder'));
        let keypadBuffer = "0", keypadMode = "";
        let discountUnit = "¥";
        let lastHistoryId = null;
        let tempRecipientName = "";
        let pendingAmount = 0;
        let paymentDetails = JSON.parse(sessionStorage.getItem('rapireji_payment_details')) || [];
        let discountVal = Number(sessionStorage.getItem('rapireji_discount_val')) || 0;
        let autoDiscounts = JSON.parse(localStorage.getItem(STORAGE_KEYS.AUTO_DISCOUNTS) || '[]');
        let globalConfig = JSON.parse(localStorage.getItem(STORAGE_KEYS.CONFIG) || '{"autoDiscountEnabled": true}');
        window.currentDiscountName = sessionStorage.getItem('rapireji_discount_name') || "";

        window.discountCounts = {};
        window.hasManualInput = false;

        function playSnd(id) {
            // 設定を読み込む（未設定の場合はデフォルトでONにする）
            const sounds = JSON.parse(localStorage.getItem('rapireji_sounds') || '{"btn": true, "pay": true}');
            const audio = document.getElementById(id);
            if (!audio) return;

            // idに応じて再生するかどうかを判定
            if (id === 'snd-beep1') {
                // 操作音（btn）の設定をチェック
                if (sounds.btn) {
                    audio.currentTime = 0;
                    audio.play().catch(e => { });
                }
            } else if (id === 'snd-beep2') {
                // 決済完了音（pay）の設定をチェック
                if (sounds.pay) {
                    audio.currentTime = 0;
                    audio.play().catch(e => { });
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!order) { location.href = "register.html"; return; }
            // --- モード判定ロジック ---
            const urlParams = new URLSearchParams(window.location.search);
            // URLパラメータ、またはセッションに店員モードが保存されているか確認
            const isStaffMode = urlParams.get('selfCheckout') === 'false' || sessionStorage.getItem('staff_override') === 'true';

            const menuBtn = document.getElementById('menu-btn');
            const clerkBtn = document.getElementById('clerk-call-btn');
            const selfConfig = JSON.parse(localStorage.getItem('rapireji_self_config') || '{"enabled": false}');

            if (isStaffMode) {
                // 【店員モード】
                sessionStorage.setItem('staff_override', 'true');

                // ボタンを「セルフに戻る」に切り替え
                clerkBtn.style.display = 'block';
                clerkBtn.innerText = "リセット";
                clerkBtn.style.backgroundColor = "var(--black)";
                clerkBtn.style.color = "var(--white)";
                clerkBtn.style.border = "6px solid var(--white)"; // 白い太枠で浮かせ、店員呼出と構造を統一
                clerkBtn.style.borderRadius = "15px";            // 角を丸める
                clerkBtn.style.boxShadow = "none";               // 影を消してスッキリさせる
                clerkBtn.style.padding = "6px 12px";
                clerkBtn.style.fontSize = "1.0rem";
                clerkBtn.style.fontWeight = "900";
                clerkBtn.style.outline = "none";

                clerkBtn.onclick = () => {
                    if (confirm("店員モードを終了し、セルフレジに戻りますか？")) {
                        sessionStorage.removeItem('staff_override');
                        location.href = 'payment.html';
                    }
                };
            } else {
                // 【通常（セルフ）モード】
                if (selfConfig.enabled) {
                    clerkBtn.style.display = 'block';
                    clerkBtn.innerText = "店員呼出"; // 文言を戻す
                    clerkBtn.style.backgroundColor = "red"; // 元のスタイル
                    clerkBtn.style.color = "#ffffff";
                    clerkBtn.style.borderRadius = "15px";

                    clerkBtn.onclick = () => {
                        const sounds = JSON.parse(localStorage.getItem('rapireji_sounds') || '{"call": true}');
                        if (sounds.call) {
                            new Audio('beep5.mp3').play().catch(() => { });
                        }
                        setTimeout(() => { location.href = 'clerk.html?from=pay'; }, 300);
                    };
                } else {
                    clerkBtn.style.display = 'none';
                }
            }
            document.getElementById('backBtn').onclick = () => location.href = 'register.html';
            initSettings();
            const lastPaymentJson = sessionStorage.getItem('rapireji_last_payment');
            if (lastPaymentJson) {
                try {
                    const paymentResult = JSON.parse(lastPaymentJson);
                    const totalUsed = (paymentResult.usedDeposit || 0) + (paymentResult.usedPoint || 0);

                    const hasDeposit = (paymentResult.usedDeposit || 0) > 0;
                    const hasPoint = (paymentResult.usedPoint || 0) > 0;

                    if (hasDeposit && hasPoint) {
                        paymentDetails.push({
                            method: `QRカード`,
                            amount: paymentResult.usedDeposit,
                            cashReceived: 0, // 【修正】現所以外はお預かりを0にする
                            change: 0
                        });
                        paymentDetails.push({
                            method: `ポイント利用`,
                            amount: paymentResult.usedPoint,
                            cashReceived: 0, // 【修正】
                            change: 0
                        });
                    } else if (hasDeposit) {
                        paymentDetails.push({
                            method: `QRカード`,
                            amount: paymentResult.usedDeposit,
                            cashReceived: 0, // 【修正】
                            change: 0
                        });
                    } else if (hasPoint) {
                        paymentDetails.push({
                            method: `ポイント利用`,
                            amount: paymentResult.usedPoint,
                            cashReceived: 0, // 【修正】
                            change: 0
                        });
                    }

                    window.lastReceiptData = paymentResult;
                    savePaymentState();

                } catch (e) {
                    console.error("QR決済結果の読み込みエラー", e);
                }
                sessionStorage.removeItem('rapireji_last_payment');
            }

            updateDisplay();
            const paidAmount = paymentDetails.reduce((sum, p) => sum + p.amount, 0);
            // order.finalCalculated が確実に存在するように安全に参照する
            const finalTotal = (order.finalCalculated && order.finalCalculated.total) ? order.finalCalculated.total : 0;
            pendingAmount = finalTotal - paidAmount;
            // 残り支払額（pendingAmount）が算出された直後あたりに入れる
            // 残額が0以下、かつ、お客さまから何らかの入金（paidAmount > 0）がある場合のみ自動決済する
            if (pendingAmount <= 0 && paidAmount > 0) {
                if (!window.isFinalizing) {
                    window.isFinalizing = true;
                    console.log('[DEBUG] 支払残額が0円になり、入金も確認できたため、決済処理を自動実行します');

                    // 完了処理を呼び出す
                    finalizeTransaction();
                }
            }
            updatePendingDisplay();

            const nextBtn = document.getElementById('next-checkout-btn');
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    sessionStorage.removeItem('rapireji_has_granted_points'); // ★ここでクリア
                    backToRegister();
                });
            }
            setupKeypadConfirmLongPress();

            const qrButtonSetting = JSON.parse(localStorage.getItem('rapireji_qr_button_config') || '{"enabled": false}');

            // 対象のボタン要素を取得
            const qrPaymentBtn = document.getElementById('qrPaymentBtn');

            if (qrPaymentBtn) {
                if (qrButtonSetting.enabled) {
                    qrPaymentBtn.style.display = 'block'; // または inline-block など、元のCSSの表示形式に合わせてください
                } else {
                    qrPaymentBtn.style.display = 'none';  // デフォルト非表示
                }
            }
        });

        // 自動割引を計算して適用する関数
        function calculateAutoDiscounts(cartItems) {
            const globalConfig = JSON.parse(localStorage.getItem('rapireji_config') || '{"autoDiscountEnabled": true}');
            console.log("【デバッグ】グローバル設定:", globalConfig);
            if (!globalConfig.autoDiscountEnabled) return { discountTotal: 0, appliedList: [] };

            let totalDiscount = 0;
            let appliedList = [];
            const currentTime = new Date().toTimeString().slice(0, 5);

            const currentDiscounts = JSON.parse(localStorage.getItem('rapireji_auto_discounts') || '[]');
            console.log("【デバッグ】読み込んだ全割引ルール:", currentDiscounts);

            currentDiscounts.forEach(rule => {
                console.log(`【デバッグ】ルール名: [${rule.customName || rule.name}], enabledの値:`, rule.enabled, "型:", typeof rule.enabled);

                // ここであえて "!rule.enabled" の動きを確認
                if (rule.enabled === false) {
                    console.log(`→ スイッチがオフのためスキップします`);
                    return;
                }

                let matchedItems = cartItems.filter(item => rule.targetIds.includes(item.id));
                let totalMatchedQty = matchedItems.reduce((sum, item) => sum + item.quantity, 0);

                let ruleDiscount = 0;

                // --- (中略: 各種割引計算ロジック) ---
                // ※ ここでどの種類の割引として判定されているかもログに出すと確実です
                if (rule.type === 'combo') {
                    const allTargetIdsPresent = rule.targetIds.every(id => cartItems.some(item => item.id === id && item.quantity > 0));
                    console.log(`【デバッグ:コンボ判定】 全商品揃っているか: ${allTargetIdsPresent}`);
                    if (allTargetIdsPresent) {
                        ruleDiscount = Number(rule.val); // 簡易的に
                    }
                }
                // ---------------------------------

                console.log(`【デバッグ】計算された割引額 (ruleDiscount):`, ruleDiscount);

                if (ruleDiscount > 0) {
                    totalDiscount += ruleDiscount;
                    appliedList.push({
                        name: rule.customName || rule.name,
                        discount: ruleDiscount
                    });
                }
            });

            console.log("【デバッグ】最終的な合計割引額:", totalDiscount);
            return { discountTotal: totalDiscount, appliedList };
        }

        function initSettings() {
            const paymentGrid = document.getElementById('paymentGrid');
            paymentGrid.innerHTML = '';
            const urlParams = new URLSearchParams(window.location.search);
            const forceStaffMode = urlParams.get('selfCheckout') === 'false';

            const selfConfig = JSON.parse(localStorage.getItem('rapireji_self_config') || '{"enabled": false}');
            const isSelfMode = forceStaffMode ? false : selfConfig.enabled;

            const currentOrder = JSON.parse(sessionStorage.getItem('currentOrder') || '{}');
            const hasExistingDiscount = (currentOrder.discountVal > 0) || (window.discountVal > 0);

            const discBtn = document.createElement('button');
            discBtn.className = 'pay-btn discount-trigger';
            discBtn.innerText = '割引';
            discBtn.onclick = () => openKeypad('discount');

            if (isSelfMode && !hasExistingDiscount) {
                discBtn.disabled = true;
                discBtn.classList.add('disabled-for-self');
            }
            paymentGrid.appendChild(discBtn);

            const savedPayments = JSON.parse(localStorage.getItem(STORAGE_KEYS.PAYMENTS)) || ["現金", "交通系IC", "クレジットカード", "バーコード決済", "その他"];

            savedPayments.forEach(data => {
                const btnName = (data && typeof data === 'object') ? data.name : data;
                if (btnName && btnName.trim() !== "") {
                    const btn = document.createElement('button');
                    btn.className = 'pay-btn';
                    btn.innerText = btnName;

                    if (isSelfMode && data.selfEnabled === false) {
                        btn.disabled = true;
                        btn.classList.add('disabled-for-self'); // 見た目制御用のクラス（任意）
                    }

                    let pTimer;
                    let islong = false;

                    // タッチ開始 / マウスダウン
                    const start = (e) => {
                        if (btn.disabled) return;
                        // 右クリックメニューやテキスト選択を防止
                        if (e.cancelable) e.preventDefault();
                        isLong = false;

                        pTimer = setTimeout(() => {
                            isLong = true;
                            handlePaymentClick(btnName, true); // 長押し実行
                        }, 600); // 判定時間を少し長めの600msに
                    };

                    // タッチ終了 / マウスアップ
                    const end = (e) => {
                        if (btn.disabled) return;
                        if (pTimer) {
                            clearTimeout(pTimer);
                            pTimer = null;
                            // 長押しが確定していない場合のみ短押しを実行
                            if (!isLong) {
                                handlePaymentClick(btnName, false);
                            }
                        }
                    };

                    // イベント登録（受動的動作を無効化して確実にキャンセルできるようにする）
                    btn.addEventListener('touchstart', start, { passive: false });
                    btn.addEventListener('touchend', end, { passive: false });
                    btn.addEventListener('mousedown', start);
                    btn.addEventListener('mouseup', end);

                    paymentGrid.appendChild(btn);
                }
            });

            const discArea = document.getElementById('discountPresetArea');
            discArea.innerHTML = "";
            const savedDiscounts = JSON.parse(localStorage.getItem(STORAGE_KEYS.DISCOUNTS)) || [];

            savedDiscounts.forEach(item => {
                if (item.name) {
                    const b = document.createElement('button');
                    b.className = 'preset-btn';
                    const displayVal = item.isPercent ? `${item.value}%` : `¥${item.value}`;
                    b.innerText = `${item.name}\n${displayVal}`;

                    b.onclick = () => {
                        playSnd('snd-beep1');
                        const newUnit = item.isPercent ? "%" : "¥";
                        if (discountUnit !== newUnit) {
                            discountUnit = newUnit;
                            keypadBuffer = "0";
                            document.getElementById('discountUnitBtn').innerText = discountUnit;
                            window.discountCounts = {};
                            window.hasManualInput = false; // 単位が変わったら手入力もリセット
                        }

                        // カウント処理
                        if (!window.discountCounts[item.name]) {
                            window.discountCounts[item.name] = 0;
                        }
                        window.discountCounts[item.name]++;

                        let currentVal = Number(keypadBuffer);
                        currentVal += Number(item.value);
                        keypadBuffer = String(currentVal);
                        updateKeypadDisplay();
                    };
                    discArea.appendChild(b);
                }
            });
        }

        function updateDisplay() {
            // --- 0. 注文データ（カートの中身など）を sessionStorage から取得 ---
            let order = JSON.parse(sessionStorage.getItem('currentOrder') || '{}');
            console.log("[DEBUG 調査] sessionStorage から読み込んだ order データ:", order);
            console.log("[DEBUG 調査] 外部から渡ってきた discountVal の値:", typeof discountVal !== 'undefined' ? discountVal : "変数自体が存在しません");

            // --- 1. 自動割引の読み込みと算出 ---
            const autoDiscounts = JSON.parse(localStorage.getItem('rapireji_auto_discounts') || '[]');
            const globalConfig = JSON.parse(localStorage.getItem('rapireji_config') || '{"autoDiscountEnabled": true}');

            let totalAutoDiscount = 0;
            let autoDiscountNames = [];

            if (globalConfig.autoDiscountEnabled && autoDiscounts.length > 0 && order.items) {
                autoDiscounts.forEach(rule => {
                    // 個別スイッチがオフのものはスキップ
                    if (rule.enabled === false) return;

                    let targetQty = 0;
                    let targetSubtotal = 0;

                    // ★コンボ割引の判定：対象商品がすべてカートに含まれているかチェック
                    let isComboValid = true;
                    if (rule.type === 'combo') {
                        if (!rule.targetIds || rule.targetIds.length === 0) {
                            isComboValid = false;
                        } else {
                            // targetIdsに含まれるすべての商品が、order.itemsに存在するか（かつ数量が1以上か）
                            isComboValid = rule.targetIds.every(targetId => {
                                return order.items.some(item => String(item.id) === String(targetId) && Number(item.qty || 0) > 0);
                            });
                        }

                        // コンボが成立している場合、対象商品の合計金額などを計算用に集計しておく
                        if (isComboValid) {
                            order.items.forEach(item => {
                                const isTarget = rule.targetIds.some(id => String(id) === String(item.id));
                                if (isTarget) {
                                    targetSubtotal += Number(item.price || 0) * Number(item.qty || 0);
                                }
                            });
                        }
                    } else {
                        // --- 従来の通常・ステップ・パーセント割引の集計 ---
                        order.items.forEach(item => {
                            const isTarget = rule.targetIds && rule.targetIds.some(id => String(id) === String(item.id));
                            if (isTarget) {
                                targetQty += Number(item.qty || 0);
                                targetSubtotal += Number(item.price || 0) * Number(item.qty || 0);
                            }
                        });
                    }

                    // 割引額の計算
                    let discountAmount = 0;
                    const ruleVal = Number(rule.val || 0);
                    const requiredQty = Number(rule.qty || 1);

                    // ルールタイプに応じた適用条件の判定
                    if (rule.type === 'combo') {
                        // コンボ割引が有効（すべての商品が揃っている）場合のみ計算
                        if (isComboValid) {
                            if (rule.unit === 'percent') {
                                discountAmount = Math.floor(targetSubtotal * (ruleVal / 100));
                            } else {
                                discountAmount = ruleVal; // 固定額引き
                            }
                        }
                    } else if (targetQty >= requiredQty) {
                        // --- 従来の step や他の割引計算 ---
                        if (rule.type === 'step') {
                            if (rule.apply === 'each') {
                                discountAmount = targetQty * ruleVal;
                            } else {
                                discountAmount = ruleVal;
                            }
                        } else if (rule.type === 'percent') {
                            discountAmount = Math.floor(targetSubtotal * (ruleVal / 100));
                        } else {
                            discountAmount = ruleVal;
                        }
                    }

                    if (discountAmount > 0) {
                        totalAutoDiscount += discountAmount;
                        autoDiscountNames.push(rule.customName || rule.name);
                    }
                });
            }
            console.log("[DEBUG] 自動割引計算結果:", { totalAutoDiscount, autoDiscountNames });

            order.appliedAutoDiscounts = {
                total: totalAutoDiscount,
                names: autoDiscountNames
            };

            // --- 2. 割引の適用順序の変更（自動割引後の金額に対して手動割引を適用） ---
            let baseDiscountVal = Number(discountVal || 0);

            let workingTaxDetails = JSON.parse(JSON.stringify(order.taxDetails || {}));
            let rates = Object.keys(workingTaxDetails).map(Number).sort((a, b) => b - a);

            let taxHtml = "";
            let finalTaxDetails = {};
            let totalAfterDiscount = new BigNumber(0);
            let afterDiscountExclTotal = new BigNumber(0);
            let subtotalExcl = new BigNumber(0);

            let remainingAutoDiscount = new BigNumber(totalAutoDiscount);

            rates.forEach(rate => {
                const originalExcl = new BigNumber(workingTaxDetails[rate]);
                subtotalExcl = subtotalExcl.plus(originalExcl);

                let appliedAutoForThisRate = new BigNumber(0);
                if (remainingAutoDiscount.gt(0)) {
                    if (remainingAutoDiscount.gte(originalExcl)) {
                        appliedAutoForThisRate = originalExcl;
                        remainingAutoDiscount = remainingAutoDiscount.minus(originalExcl);
                    } else {
                        appliedAutoForThisRate = remainingAutoDiscount;
                        remainingAutoDiscount = new BigNumber(0);
                    }
                }

                const afterAutoExcl = originalExcl.minus(appliedAutoForThisRate);

                workingTaxDetails[rate] = {
                    originalExcl: originalExcl.toNumber(),
                    autoDiscountApplied: appliedAutoForThisRate.toNumber(),
                    afterAutoExcl: afterAutoExcl.toNumber()
                };
            });

            let remainingManualDiscount = new BigNumber(baseDiscountVal);

            rates.forEach(rate => {
                const data = workingTaxDetails[rate];
                const currentExcl = new BigNumber(data.afterAutoExcl);

                let appliedManualForThisRate = new BigNumber(0);
                if (remainingManualDiscount.gt(0)) {
                    if (remainingManualDiscount.gte(currentExcl)) {
                        appliedManualForThisRate = currentExcl;
                        remainingManualDiscount = remainingManualDiscount.minus(currentExcl);
                    } else {
                        appliedManualForThisRate = remainingManualDiscount;
                        remainingManualDiscount = new BigNumber(0);
                    }
                }

                const finalExcl = currentExcl.minus(appliedManualForThisRate);
                afterDiscountExclTotal = afterDiscountExclTotal.plus(finalExcl);

                const totalAppliedDiscountForThisRate = new BigNumber(data.autoDiscountApplied).plus(appliedManualForThisRate);

                const finalTax = finalExcl.times(rate).dividedBy(100).integerValue(BigNumber.ROUND_FLOOR);
                const finalIncl = finalExcl.plus(finalTax);
                totalAfterDiscount = totalAfterDiscount.plus(finalIncl);

                finalTaxDetails[rate] = {
                    excl: finalExcl.toNumber(),
                    tax: finalTax.toNumber(),
                    originalExcl: data.originalExcl,
                    discountApplied: totalAppliedDiscountForThisRate.toNumber(),
                    autoDiscountApplied: data.autoDiscountApplied,
                    manualDiscountApplied: appliedManualForThisRate.toNumber()
                };

                if (data.originalExcl > 0) {
                    taxHtml += `<div class="tax-line" style="margin-bottom:8px; border-bottom:1px solid #eee; padding-bottom:4px;">
                    <div style="display:flex; justify-content:space-between; width:100%;">
                        <span>${rate}%対象 (税抜 ¥${data.originalExcl.toLocaleString()})</span>
                        <span>内消費税 ¥${Math.floor(data.originalExcl * (rate / 100)).toLocaleString()}</span>
                    </div>`;
                    if (totalAppliedDiscountForThisRate.gt(0)) {
                        taxHtml += `<div style="color:var(--danger); font-size:0.75rem; text-align:right;">
                        割引:-¥${totalAppliedDiscountForThisRate.toLocaleString()}`;
                        if (autoDiscountNames.length > 0) {
                            taxHtml += ` (自動: ${autoDiscountNames.join(', ')})`;
                        }
                        taxHtml += `</div>`;
                    }
                    taxHtml += `</div>`;
                }
            });

            let combinedDiscountVal = totalAutoDiscount + baseDiscountVal;
            console.log("[DEBUG] 割引内訳（自動+手動）:", { totalAutoDiscount, baseDiscountVal, combinedDiscountVal });

            document.getElementById('subtotal').innerText = `¥${subtotalExcl.toNumber().toLocaleString()}`;
            document.getElementById('discountAmount').innerText = `-¥${new BigNumber(combinedDiscountVal).toNumber().toLocaleString()}`;
            document.getElementById('finalTotal').innerText = `¥${totalAfterDiscount.toNumber().toLocaleString()}`;

            const afterDiscountLine = document.getElementById('afterDiscountExclLine');
            if (combinedDiscountVal > 0) {
                document.getElementById('afterDiscountExcl').innerText = `¥${afterDiscountExclTotal.toNumber().toLocaleString()}`;
                afterDiscountLine.style.display = 'flex';
            } else {
                afterDiscountLine.style.display = 'none';
            }

            const taxArea = document.getElementById('taxBreakdown');
            taxArea.innerHTML = taxHtml;
            taxHtml !== "" ? taxArea.classList.remove('hidden') : taxArea.classList.add('hidden');

            order.finalCalculated = {
                total: totalAfterDiscount.toNumber(),
                details: finalTaxDetails
            };

            sessionStorage.setItem('currentOrder', JSON.stringify(order));
            console.log("[DEBUG 調査] sessionStorage に保存し直した order データ:", order);

            // --- 3. 決済自動判定（古い重複ロジックはすべて削除し、ここだけに一本化） ---
            const paidAmount = (typeof paymentDetails !== 'undefined' && Array.isArray(paymentDetails))
                ? paymentDetails.reduce((sum, p) => sum + p.amount, 0)
                : 0;

            const finalTotal = (order.finalCalculated && order.finalCalculated.total) ? order.finalCalculated.total : 0;
            pendingAmount = finalTotal - paidAmount;

            console.log("[DEBUG 調査] 決済自動判定:", { finalTotal, paidAmount, pendingAmount });

            // 残額が0以下、かつ「実際に何らかの支払い（paidAmount > 0）」が行われている場合のみ自動決済
            if (pendingAmount <= 0 && paidAmount > 0) {
                if (!window.isFinalizing) {
                    window.isFinalizing = true;
                    console.log('[DEBUG] 支払残額が0円になり、入金も確認できたため、決済処理を自動実行します');
                    finalizeTransaction();
                }
            }

            if (typeof updatePendingDisplay === 'function') {
                updatePendingDisplay();
            }
        }

        function updatePendingDisplay() {
            const progressArea = document.getElementById('paymentProgress');
            if (!progressArea) return;

            // 1つでも決済があるか、あるいは割引適用などで金額が動いている場合に表示
            if (paymentDetails.length > 0) {
                let historyHtml = paymentDetails.map(p => {
                    return `<div>${p.method}: ¥${p.amount.toLocaleString()}</div>`;
                }).join('');

                progressArea.innerHTML = `
                ${historyHtml}
                <div style="font-weight: bold; margin-top: 5px;">残り: ¥${pendingAmount.toLocaleString()}</div>
            `;
            } else {
                progressArea.innerHTML = "";
            }
        }

        window.handlePaymentClick = (method, isLong) => {
            if (isLong) {
                playSnd('snd-beep1');
                openKeypad('partial_pay_' + method);
            } else {
                if (method.includes('現金')) {
                    playSnd('snd-beep1');
                    openKeypad('cash'); // 現金は短押しでも金額入力（お預かり入力）へ
                } else {
                    playSnd('snd-beep1'); // 決済操作音
                    processPayment(method, pendingAmount);
                }
            }
        };

        window.openKeypad = (mode) => {
            if (mode === 'discount') {
                playSnd('snd-beep1');
                window.discountCounts = {};
                window.hasManualInput = false;
            }
            keypadMode = mode; keypadBuffer = "0";
            discountUnit = "¥";

            // タイトルの条件分岐を修正
            let title = "金額入力";
            if (mode === 'cash') {
                title = "現金お預かり";
            } else if (mode === 'discount') {
                title = "割引額入力";
            } else if (mode.startsWith('partial_pay_')) {
                const methodName = mode.replace('partial_pay_', '');
                title = `${methodName} 決済額`;
            }

            document.getElementById('keypadTitle').innerText = title;
            document.getElementById('discountUnitBtn').innerText = "¥";
            document.getElementById('discountUnitBtn').style.visibility = (mode === 'discount') ? 'visible' : 'hidden';
            document.getElementById('discountPresetArea').style.display = (mode === 'discount') ? 'grid' : 'none';
            updateKeypadDisplay(); openModal('keypadModal');
        };

        window.toggleDiscountUnit = () => {
            if (keypadMode !== 'discount') return;
            playSnd('snd-beep1');
            discountUnit = (discountUnit === "¥") ? "%" : "¥";
            document.getElementById('discountUnitBtn').innerText = discountUnit;
            window.discountCounts = {}; // 単位を変えたらカウントもリセット
            window.hasManualInput = false;
            updateKeypadDisplay();
        };

        window.pressNum = (num) => {
            playSnd('snd-beep1');
            if (keypadMode === 'discount') window.hasManualInput = true; // キーパッド操作を検知
            if (keypadBuffer === "0") {
                if (num === '00') return;
                keypadBuffer = num;
            } else {
                keypadBuffer += num;
            }
            updateKeypadDisplay();
        };

        function updateKeypadDisplay() {
            const valStr = Number(keypadBuffer).toLocaleString();
            document.getElementById('keypadDisplay').innerText = (keypadMode === 'discount' && discountUnit === "%") ? `${valStr}%` : `¥${valStr}`;
        }

        function finalizeInput(isLongPress = false) {
            const val = Number(keypadBuffer);

            // 1. 分割決済（決済ボタン長押し）時の入力
            if (keypadMode.startsWith('partial_pay_')) {
                const method = keypadMode.replace('partial_pay_', '');
                if (val <= 0) return;

                if (method.includes('現金')) {
                    const payAmount = Math.min(val, pendingAmount);
                    processPayment(method, payAmount); // 現金は入力額をそのまま渡してお釣り計算も行う
                } else {
                    if (val > pendingAmount) {
                        alert(`残り金額（¥${pendingAmount.toLocaleString()}）を超えた入力はできません。`);
                        return;
                    }
                    // 現金以外は入力された金額をそのまま決済
                    processPayment(method, val);
                }
                closeModal('keypadModal');
                return;
            }

            // 2. 通常の現金決済（決済ボタン短押し）時の入力
            if (keypadMode === 'cash') {
                if (val < pendingAmount) {
                    alert("金額が不足しています。");
                    return;
                }
                if (val >= pendingAmount + 10000) {
                    if (!confirm(`お預かり: ¥${val.toLocaleString()}\nに間違いありませんか？`)) return;
                }
                processPayment('現金', pendingAmount, val);
                closeModal('keypadModal');
                return;
            }

            // 3. 割引処理
            if (keypadMode === 'discount') {
                playSnd('snd-beep1');

                let currentOrderData = JSON.parse(sessionStorage.getItem('currentOrder') || '{}');
                let totalExcl = new BigNumber(0);

                if (currentOrderData.finalCalculated && currentOrderData.finalCalculated.details) {
                    Object.values(currentOrderData.finalCalculated.details).forEach(detail => {
                        totalExcl = totalExcl.plus(detail.excl || 0);
                    });
                } else {
                    totalExcl = new BigNumber(Object.values(currentOrderData.taxDetails || {}).reduce((a, b) => a + b, 0));
                }

                let calculatedDiscount = new BigNumber(0);
                const inputVal = new BigNumber(val);
                if (discountUnit === "%") {
                    calculatedDiscount = totalExcl.times(inputVal).dividedBy(100).integerValue(BigNumber.ROUND_FLOOR);
                } else {
                    calculatedDiscount = inputVal;
                }

                let finalName = "";
                if (isLongPress) {
                    const manualName = prompt("割引名称を入力してください", "");
                    finalName = manualName || "特別割引";
                } else {
                    let nameParts = [];
                    for (const [name, count] of Object.entries(window.discountCounts)) {
                        if (count > 0) nameParts.push(count > 1 ? `${name}×${count}` : name);
                    }
                    finalName = nameParts.join(', ');
                    if (window.hasManualInput) finalName = finalName ? `${finalName}含む` : "特別割引";
                }
                window.currentDiscountName = finalName;

                if (calculatedDiscount.gt(totalExcl)) {
                    alert(`割引額が自動割引適用後の税抜小計（¥${totalExcl.toNumber().toLocaleString()}）を超えています。`);
                    return;
                }

                discountVal = calculatedDiscount.toNumber();
                savePaymentState();
                updateDisplay();

                // ★修正: order ではなく currentOrderData から安全に total を取得
                pendingAmount = currentOrderData.finalCalculated ? currentOrderData.finalCalculated.total : 0;

                if (pendingAmount <= 0) {
                    if (!window.isFinalizing) {
                        window.isFinalizing = true;
                        console.log('[DEBUG] 支払残額が0円になったため、決済処理を自動実行します');
                        finalizeTransaction();
                    }
                }

                // 必ずモーダルが閉じるように最後に配置
                closeModal('keypadModal');
            }
        }

        window.processPayment = (method, amount, cashReceived = 0) => {
            const bnPending = new BigNumber(pendingAmount);
            const bnAmount = new BigNumber(amount);
            const bnCashReceived = new BigNumber(cashReceived);

            // 支払うべき金額（入力額が残りより多ければ残りを、少なければ入力額を）
            const payAmount = BigNumber.min(bnAmount, bnPending);

            // 現金の場合のお釣り計算
            const change = bnCashReceived.gt(payAmount) ? bnCashReceived.minus(payAmount) : new BigNumber(0);

            paymentDetails.push({
                method: method,
                amount: payAmount.toNumber(),
                cashReceived: bnCashReceived.toNumber(),
                change: change.toNumber()
            });
            savePaymentState();

            // 残金を減らす
            pendingAmount = bnPending.minus(payAmount).toNumber();
            updatePendingDisplay();

            if (pendingAmount <= 0) {
                finalizeTransaction();
            }
        };

        // 完了処理（履歴保存の項目を落とさないように統合）
        function finalizeTransaction() {
            console.trace("[DEBUG 追跡] finalizeTransaction が呼び出されました！");
            playSnd('snd-beep2');
            const now = new Date();
            lastHistoryId = Date.now();

            // ★修正: セッションストレージから最新の完全なデータを再取得（appliedAutoDiscountsも含める）
            let storedOrder = JSON.parse(sessionStorage.getItem('currentOrder') || '{}');
            let currentOrderData = (typeof order !== 'undefined' && order && order.appliedAutoDiscounts) ? order : storedOrder;

            // 万が一、グローバルの order に appliedAutoDiscounts が無くて storedOrder にある場合のフォールバック
            if (!currentOrderData.appliedAutoDiscounts && storedOrder.appliedAutoDiscounts) {
                currentOrderData.appliedAutoDiscounts = storedOrder.appliedAutoDiscounts;
            } else if (!currentOrderData.finalCalculated.details) {
                currentOrderData.finalCalculated.details = {};
            }
            if (!currentOrderData.items) {
                currentOrderData.items = [];
            }

            console.log("[DEBUG レシート調査修正版] currentOrderData:", currentOrderData);
            console.log("[DEBUG レシート調査修正版] appliedAutoDiscounts:", currentOrderData.appliedAutoDiscounts);

            const itemsWithDiscount = currentOrderData.items.map(item => {
                const bnPrice = new BigNumber(item.price);
                const bnQty = new BigNumber(item.qty);
                const bnDiscount = new BigNumber(item.appliedDiscount ? item.appliedDiscount.amount : 0);

                // originalPrice = 単価 + (割引合計 / 数量)
                const originalPrice = bnPrice.plus(bnDiscount.dividedBy(bnQty));

                return {
                    ...item,
                    originalPrice: originalPrice.toNumber(),
                    itemDiscountAmount: bnDiscount.toNumber(),
                    itemDiscountName: (item.appliedPresets && Object.keys(item.appliedPresets).length > 0)
                        ? Object.keys(item.appliedPresets).join('、')
                        : (item.appliedDiscount ? "特別割引" : "")
                };
            });

            const methodSummary = paymentDetails.map(p => p.method).join('・');

            // finalizeTransaction 関数内など、履歴オブジェクトを作る手前に配置
            console.log("[DEBUG レシート調査] currentOrderData:", currentOrderData);
            console.log("[DEBUG レシート調査] appliedAutoDiscounts:", currentOrderData.appliedAutoDiscounts);

            const historyEntry = {
                id: lastHistoryId,
                items: itemsWithDiscount,
                subtotal: new BigNumber(currentOrderData.totalAmount || 0).toNumber(), // 税抜小計
                taxDetails: currentOrderData.taxDetails || {},
                finalTaxDetails: currentOrderData.finalCalculated.details,
                appliedAutoDiscounts: currentOrderData.appliedAutoDiscounts || null,
                discount: new BigNumber(typeof discountVal !== 'undefined' ? discountVal : 0).toNumber(),
                discountName: window.currentDiscountName || "",
                totalAmount: new BigNumber(currentOrderData.finalCalculated.total || 0).toNumber(),
                paymentMethod: methodSummary,
                paymentDetails: paymentDetails,
                cashReceived: paymentDetails.reduce((sum, p) => sum.plus(p.cashReceived || 0), new BigNumber(0)).toNumber(),
                change: paymentDetails.reduce((sum, p) => sum.plus(p.change || 0), new BigNumber(0)).toNumber(),
                createdAt: now.toISOString(),
                isVoided: false,
                receiptIssued: false,
                billIssued: false,
                // ★修正箇所：三項演算子の構文ミス（ ? null ）を修正
                memberInfo: window.lastReceiptData ? {
                    cardId: window.lastReceiptData.cardId,
                    cardName: window.lastReceiptData.cardName,
                    earnedPoint: window.lastReceiptData.earnedPoint,
                    usedDeposit: window.lastReceiptData.usedDeposit,
                    usedPoint: window.lastReceiptData.usedPoint,
                    currentBalance: window.lastReceiptData.currentBalance,
                    currentPoint: window.lastReceiptData.currentPoint
                } : null
            };

            let history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
            history.push(historyEntry);
            localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(history));

            const products = JSON.parse(localStorage.getItem(STORAGE_KEYS.PRODUCTS) || '[]');
            let stockChanged = false;

            // 2. 購入されたアイテムごとに在庫を減らす
            historyEntry.items.forEach(item => {
                // 商品名でマスターから対象を探す
                const pIdx = products.findIndex(p => p.name === item.name);

                // 在庫設定が存在する場合のみ減算
                if (pIdx !== -1 && products[pIdx].stock !== undefined) {
                    products[pIdx].stock = Number(products[pIdx].stock) - Number(item.qty);
                    stockChanged = true;
                }
            });

            // 3. 変更があった場合のみPRODUCTSを保存
            if (stockChanged) {
                localStorage.setItem(STORAGE_KEYS.PRODUCTS, JSON.stringify(products));
            }

            window.currentPaymentData = { ...historyEntry, date: now };

            const cashTotalForStamp = paymentDetails.reduce((sum, p) => {
                return p.method.includes('現金') ? sum.plus(p.amount) : sum;
            }, new BigNumber(0));

            const msgArea = document.getElementById('paymentResultMsg');
            const totalChange = new BigNumber(historyEntry.change);
            msgArea.innerHTML = "";

            if (totalChange.gt(0)) {
                msgArea.innerHTML += `<div style="color: var(--danger); font-size: 1.5rem; font-weight: 900;">お釣り: ¥${totalChange.toNumber().toLocaleString()}</div>`;
            }

            if (cashTotalForStamp.gte(50000)) {
                msgArea.innerHTML += `<div style="color: var(--danger); font-size: 1.1rem; font-weight: 900; border: 2px solid var(--danger); padding: 5px 15px; margin: 5px; background: white; display: inline-block;">収入印紙が必要です</div>`;
            }
            sessionStorage.removeItem('rapireji_payment_details');
            sessionStorage.removeItem('rapireji_discount_val');
            sessionStorage.removeItem('rapireji_discount_name');
            sessionStorage.removeItem('currentOrder');
            generateContent('receipt');
            openModal('receiptModal');
        }

        // --- 追加：状態保存用関数 ---
        function savePaymentState() {
            sessionStorage.setItem('rapireji_payment_details', JSON.stringify(paymentDetails));
            sessionStorage.setItem('rapireji_discount_val', discountVal.toString());
            sessionStorage.setItem('rapireji_discount_name', window.currentDiscountName || "");
        }
        // --------------------------

        window.generateContent = (type) => {
            const info = window.currentPaymentData;
            const d = shopInfo;
            const zip = savedProfile.zipCode ? `〒${savedProfile.zipCode}` : "";
            const regNo = (savedProfile && savedProfile.registrationNumber) ? savedProfile.registrationNumber : null;
            const receiptPreview = document.getElementById('receiptPreview');

            const previewConfig = JSON.parse(localStorage.getItem('rapireji_preview_config') || '{"show": true}');
            const showPreview = previewConfig.show;

            if (!showPreview) {
                receiptPreview.style.display = 'none';
            } else {
                receiptPreview.style.display = 'block';
            }

            const MAX_WIDTH = 24;
            const line = "-".repeat(MAX_WIDTH) + "\n";

            const getLen = (str) => {
                let len = 0; if (!str) return 0;
                for (let i = 0; i < str.length; i++) {
                    (str.charCodeAt(i) <= 255) ? len += 1 : len += 2;
                }
                return len;
            };

            // --- generateContent関数内の formatLine とテキスト生成ロジックの修正 ---

            const formatLine = (label, value) => {
                const labelLen = getLen(label);
                const valueLen = getLen(value);

                // 値がない場合（住所・店名など）の自動折り返し
                if (!value) {
                    let result = "";
                    let currentLine = "";
                    let currentLen = 0;
                    for (const char of label) {
                        const charLen = getLen(char);
                        // 現在の長さ + 次の文字 > 最大幅 なら改行
                        if (currentLen + charLen > MAX_WIDTH) {
                            result += currentLine + "\n";
                            currentLine = char;
                            currentLen = charLen;
                        } else {
                            currentLine += char;
                            currentLen += charLen;
                        }
                    }
                    return result + currentLine + "\n";
                }

                // 値がある場合（商品名と価格など）
                const freeSpace = MAX_WIDTH - (labelLen + valueLen);
                if (freeSpace < 1) {
                    // ラベルを折り返し処理し、最後の行に値を右寄せ
                    let result = "";
                    let currentLine = "";
                    let currentLen = 0;
                    const chars = Array.from(label);
                    for (let i = 0; i < chars.length; i++) {
                        const charLen = getLen(chars[i]);
                        if (currentLen + charLen > MAX_WIDTH) {
                            result += currentLine + "\n";
                            currentLine = chars[i];
                            currentLen = charLen;
                        } else {
                            currentLine += chars[i];
                            currentLen += charLen;
                        }
                    }
                    const lastLineSpace = MAX_WIDTH - (getLen(currentLine) + valueLen);
                    return (lastLineSpace >= 1)
                        ? result + currentLine + " ".repeat(lastLineSpace) + value + "\n"
                        : result + currentLine + "\n" + " ".repeat(MAX_WIDTH - valueLen) + value + "\n";
                }
                return label + " ".repeat(freeSpace) + value + "\n";
            };

            let t = "";
            const dateStr = info.date.toLocaleString();

            // 1. 現金受領額の合計計算（BigNumber導入）
            const cashTotal = (info.paymentDetails || []).reduce((sum, p) => {
                return p.method.includes('現金') ? sum.plus(p.amount) : sum;
            }, new BigNumber(0));
            const needsStamp = cashTotal.gte(50000);

            if (type === 'receipt') {
                t += `       レ シ ー ト \n\n`;
                t += formatLine(`${d.companyName}`, "");
                // レシートに郵便番号＋住所を追加
                if (zip) t += formatLine(zip, "");         // 郵便番号のみで1行
                if (d.address) t += formatLine(d.address, "");
                if (d.tel) t += formatLine(`TEL: ${d.tel || ""}`, "");
                if (regNo) t += formatLine(`登録番号: ${regNo}`, "");
                t += `日時: ${dateStr}\n${line}`;

                info.items.forEach(item => {
                    const bnPrice = new BigNumber(item.price);
                    const bnQty = new BigNumber(item.qty);
                    // 商品ごとの割引額を取得
                    const bnDisc = new BigNumber(item.itemDiscountAmount || 0);

                    // 表示用の単価（割引後の金額を表示する場合。元の単価なら bnPrice を使用）
                    const itemFinalExcl = BigNumber.max(0, bnPrice.times(bnQty));

                    const priceVal = `¥${itemFinalExcl.toNumber().toLocaleString()}`;
                    const rate = (item.taxRate !== undefined) ? item.taxRate : (item.rate !== undefined ? item.rate : null);
                    const taxMarker = (rate !== null) ? ` *${rate}` : "";
                    const label = item.name + taxMarker + (item.qty > 1 ? ` (x${item.qty})` : "");
                    t += formatLine(label, priceVal);

                    // --- 商品別割引の印字ロジック修正 ---
                    if (bnDisc.gt(0)) {
                        let displayDiscName = "";
                        let discNames = [];
                        const hasPresets = item.appliedPresets && Object.keys(item.appliedPresets).length > 0;

                        if (hasPresets) {
                            for (const [name, count] of Object.entries(item.appliedPresets)) {
                                const isUnit = item.appliedDiscount && item.appliedDiscount.mode === 'unit';
                                const totalCount = isUnit ? (count * item.qty) : count;
                                discNames.push(totalCount > 1 ? `${name}×${totalCount}` : name);
                            }
                            const presetText = discNames.join('、');
                            // 手入力(hasManualInput)が含まれる場合の表記
                            displayDiscName = item.hasManualInput ? `${presetText}含む` : presetText;
                        } else {
                            // プリセットがない場合は、保存された名称か「特別割引」を表示
                            displayDiscName = item.itemDiscountName || "特別割引";
                        }

                        // 割引行の生成（インデントをつけて印字）
                        const discLabel = `  (${displayDiscName} -¥${bnDisc.toNumber().toLocaleString()})`;
                        t += formatLine(discLabel, "");

                    }

                });
                t += line;
                const details = info.finalTaxDetails || {};
                const originalExclTotal = Object.values(details).reduce((a, b) => a.plus(b.originalExcl || 0), new BigNumber(0));
                t += formatLine("小計(税抜)", `¥${originalExclTotal.toNumber().toLocaleString()}`);

                // --- 【追加】自動割引の名称と金額の印字 ---
                if (info.appliedAutoDiscounts && info.appliedAutoDiscounts.total > 0) {
                    const autoNames = (info.appliedAutoDiscounts.names || []).join('、') || "自動割引";
                    t += formatLine(`割引(${autoNames})`, `-¥${new BigNumber(info.appliedAutoDiscounts.total).toNumber().toLocaleString()}`);
                }
                // ------------------------------------------

                const bnTotalDisc = new BigNumber(info.discount || 0);
                if (bnTotalDisc.gt(0)) {
                    t += formatLine(`割引(${info.discountName || "割引"})`, `-¥${bnTotalDisc.toNumber().toLocaleString()}`);
                }

                const afterDiscountExclTotal = Object.values(details).reduce((a, b) => a.plus(b.excl), new BigNumber(0));
                if ((info.appliedAutoDiscounts && info.appliedAutoDiscounts.total > 0) || bnTotalDisc.gt(0)) {
                    t += formatLine("割引後小計(税抜)", `¥${afterDiscountExclTotal.toNumber().toLocaleString()}`);
                }

                t += formatLine("合計(税込)", `¥${new BigNumber(info.totalAmount).toNumber().toLocaleString()}`);
                t += line;

                // 税率別内訳のループ
                Object.keys(details).map(Number).sort((a, b) => b - a).forEach(rate => {
                    const data = details[rate];
                    const bnExcl = new BigNumber(data.excl);
                    if (bnExcl.gt(0)) {
                        t += `${rate}%対象(税抜 ¥${bnExcl.toNumber().toLocaleString()})\n`;
                        t += formatLine("  内消費税", `¥${new BigNumber(data.tax).toNumber().toLocaleString()}`);
                        t += line;
                    }
                });

                if (info.paymentDetails && info.paymentDetails.length > 1) {
                    // 複数決済の場合の内訳表示
                    info.paymentDetails.forEach(p => {
                        t += formatLine(`決済方法: ${p.method}`, `¥${p.amount.toLocaleString()}`);
                    });
                } else {
                    // 1つの場合、または従来通りの表示
                    t += `決済方法: ${info.paymentMethod}\n`;
                }
                if (new BigNumber(info.cashReceived).gt(0)) {
                    t += formatLine("お預かり", `¥${new BigNumber(info.cashReceived).toNumber().toLocaleString()}`);
                    t += formatLine("お釣り", `¥${new BigNumber(info.change).toNumber().toLocaleString()}`);
                }
                // --- 【追加】QRカード / 会員情報のレシート印字 ---
                const receiptData = window.lastReceiptData;
                if (receiptData && receiptData.cardId) {
                    t += line;
                    // 会員番号の下4桁以外を * でマスク（例: "********1234"）
                    const cardIdStr = String(receiptData.cardId);
                    const maskedId = cardIdStr.length > 4
                        ? "*".repeat(cardIdStr.length - 4) + cardIdStr.slice(-4)
                        : cardIdStr;

                    t += formatLine("会員番号", maskedId);

                    // 今回の獲得ポイント（0より大きい場合のみ印字、または常に印字する場合は条件緩和）
                    if (receiptData.earnedPoint !== undefined) {
                        t += formatLine("今回獲得ポイント", `+${Number(receiptData.earnedPoint).toLocaleString()}pt`);
                    }

                    // 残高（デポジット残高が存在、または管理されている場合のみ表示）
                    if (receiptData.currentBalance !== undefined && receiptData.currentBalance !== null) {
                        t += formatLine("残高", `¥${Number(receiptData.currentBalance).toLocaleString()}`);
                    }

                    // ポイント残高（ポイント機能がある場合のみ表示）
                    if (receiptData.currentPoint !== undefined && receiptData.currentPoint !== null) {
                        t += formatLine("ポイント残高", `${Number(receiptData.currentPoint).toLocaleString()}pt`);
                    }
                }
                // ----------------------------------------------------
                if (needsStamp) t += `\n[[STAMP_HERE]]\n`;
                t += line;
                t += `※ *の後の数字は税率です\n`;
                t += `ありがとうございました\n`;
                if (d.memo) t += formatLine(`${d.memo}`);

            } else {
                // 領収書
                t += `      領 収 書\n\n 日付：${info.date.toLocaleDateString()}\n No. ${info.id}\n\n`;
                // 領収書の宛名中央寄せ
                const recipientLabel = `${tempRecipientName || "                "}  様`;
                const nameLen = getLen(recipientLabel);
                const namePadding = Math.max(0, Math.floor((MAX_WIDTH - nameLen) / 2));
                t += " ".repeat(namePadding) + recipientLabel + "\n\n";
                // 合計金額のBigNumber化
                const bnTotal = new BigNumber(info.totalAmount);
                const amountStr = `金額 ¥${bnTotal.toNumber().toLocaleString()}-`;
                const padding = Math.max(0, Math.floor((MAX_WIDTH - getLen(amountStr)) / 2));
                t += " ".repeat(padding) + amountStr + "\n\n";

                t += formatLine(` 但 ${d.receiptType || "商品代"} として`, "");
                t += ` 正に領収いたしました\n\n [内訳]\n`;

                // 内訳の集計（BigNumber導入）
                Object.keys(info.finalTaxDetails).map(Number).sort((a, b) => b - a).forEach(rate => {
                    const data = info.finalTaxDetails[rate];
                    const bnExcl = new BigNumber(data.excl);
                    const bnTax = new BigNumber(data.tax);

                    if (bnExcl.gt(0)) {
                        t += formatLine(` ${rate}%対象税抜:`, `¥${bnExcl.toNumber().toLocaleString()}`);
                        t += formatLine(` 内消費税:`, `¥${bnTax.toNumber().toLocaleString()}`);
                    }
                });
                if (needsStamp) t += `\n[[STAMP_HERE]]\n`;
                t += `\n${line}`;
                t += "[発行者]\n"; // 「発行者:」で改行
                t += formatLine(`${d.companyName}`, "");
                if (zip) t += formatLine(zip, "");
                if (d.address) t += formatLine(d.address, "");
                if (d.tel) t += formatLine(`TEL: ${d.tel || ""}`, "");
                if (regNo) t += formatLine(`登録番号: ${regNo}`, "");
                t += line;
            }
            receiptPreview.innerHTML = t.replace('[[STAMP_HERE]]', `<div style="border: 1px solid #000; width: 60px; height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 10px; margin: 10px 0 10px 50px;">収入印紙<br>貼付枠</div>`);
        };

        // --- 以下、履歴更新やモーダル制御はそのまま ---
        function updateHistoryFlag(field) {
            if (!lastHistoryId) return;
            const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.HISTORY) || '[]');
            const idx = history.findIndex(h => h.id === lastHistoryId);
            if (idx !== -1) {
                history[idx][field] = true;
                localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(history));
            }
        }

        document.getElementById('btnPrintReceipt').onclick = () => {
            generateContent('receipt');
            updateHistoryFlag('receiptIssued');
            window.print();
        };

        const btnPrintBill = document.getElementById('btnPrintBill');
        let longPressTimer;
        let isLongPress = false;

        const startPress = (e) => {
            isLongPress = false;
            longPressTimer = setTimeout(() => {
                isLongPress = true;
                const name = prompt("領収書の宛名を入力してください", tempRecipientName);
                if (name !== null) {
                    tempRecipientName = name;
                    generateContent('bill');
                    updateHistoryFlag('billIssued');
                    window.print();
                }
            }, 500);
        };

        const endPress = (e) => {
            clearTimeout(longPressTimer);
            if (!isLongPress && (e.type === 'mouseup' || e.type === 'touchend')) {
                tempRecipientName = "";
                generateContent('bill');
                updateHistoryFlag('billIssued');
                window.print();
            }
        };

        btnPrintBill.addEventListener('mousedown', startPress);
        btnPrintBill.addEventListener('mouseup', endPress);
        btnPrintBill.addEventListener('touchstart', startPress, { passive: false });
        btnPrintBill.addEventListener('touchend', (e) => {
            e.preventDefault();
            endPress(e);
        });

        // 確定ボタンの長押しを監視する設定
        function setupKeypadConfirmLongPress() {
            const btn = document.getElementById('keypadConfirmBtn');
            let timer, longPressed = false;

            const start = (e) => {
                longPressed = false;
                timer = setTimeout(() => {
                    if (keypadMode === 'discount') {
                        longPressed = true;
                        finalizeInput(true); // 長押し確定
                    }
                }, 500); // 0.5秒で長押しと判定
            };

            const end = (e) => {
                clearTimeout(timer);
                if (!longPressed) {
                    if (e.type === 'touchend') e.preventDefault();
                    finalizeInput(false); // 通常確定
                }
            };

            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', end);
            btn.addEventListener('touchstart', start, { passive: false });
            btn.addEventListener('touchend', end);
        }

        document.getElementById('keypadConfirmBtn').onclick = null;

        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        function backToRegister() {
            sessionStorage.removeItem('staff_override');
            location.href = 'register.html';
        }

        document.getElementById('qrPaymentBtn').addEventListener('click', () => {
            playSnd('snd-beep1');
            // #finalTotal のテキスト（例: "¥1,500"）を取得
            const finalTotalText = document.getElementById('finalTotal').innerText;

            // "¥" や "," を取り除いて数値に変換する
            const qrfinaltotal = parseInt(finalTotalText.replace(/[¥,]/g, ''), 10) || 0;

            if (qrfinaltotal <= 0) {
                alert('決済する金額がありません。');
                return;
            }

            // 金額をクエリパラメータに付与してQR決済画面へ移動
            window.location.href = `qrpay.html?amount=${qrfinaltotal}`;
        });
    </script>
</body>
